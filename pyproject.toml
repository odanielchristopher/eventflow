[project]
name = "eventflow"
version = "0.1.0"
description = "EventFlow API with FastAPI, Beanie, and MongoDB persistence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beanie>=1.26.0",
    "fastapi[standard]>=0.136.1",
    "fastapi-pagination>=0.15.12",
    "faker>=25.0.0",
    "minio>=7.2.18",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "scalar-fastapi>=1.8.1",
    "uvicorn[standard]>=0.47.0",
]
