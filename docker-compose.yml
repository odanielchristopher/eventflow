services:
  api:
    build: .
    container_name: eventflow-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URL: ${MONGODB_URL:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-eventflow}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${APP_PORT:-3000}:3000"

  mongo:
    image: mongo:7
    container_name: eventflow-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: eventflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eventflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eventflow-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  mongo_data:
  minio_data:
